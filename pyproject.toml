[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbctl"
version = "0.1.0"
description = "One Odoo database per git branch - agnostic, Docker-based"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
]

[project.scripts]
dbctl = "dbctl.cli:main"

[tool.setuptools]
packages = ["dbctl", "dbctl.commands", "dbctl.strategies"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["logs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.11"
files = ["dbctl"]
exclude = ["logs/"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires Docker with the dbctl-sandbox project running",
]
