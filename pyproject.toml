[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbctl"
version = "0.1.0"
description = "One Odoo database per git branch - agnostic, Docker-based"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
dbctl = "dbctl.cli:main"

[tool.setuptools]
packages = ["dbctl", "dbctl.commands", "dbctl.strategies"]
