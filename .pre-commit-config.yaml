# Pre-commit: sane defaults + ruff (lint/format) + mypy (types).
# Instalar: uv tool install pre-commit && pre-commit install
# Rodar manualmente: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        pass_filenames: false  # [tool.mypy] files = ["dbctl"] define the scope
        additional_dependencies:
          - typer>=0.12
