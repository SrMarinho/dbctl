# dbctl project configuration.
#
# Copy this file to your project as .dbctl.toml and fill in the values.
# The file can live at the repository root OR inside an already-ignored
# folder (e.g. temp/), which avoids touching a versioned .gitignore.
#
# IMPORTANT: if you placed it at the root, add ".dbctl.toml" (and your seeds
# folder, if it lives outside an already-ignored directory) to the project's
# .gitignore. This file contains local credentials and must never be
# committed. Relative paths inside this file (seeds.path, compose_file,
# override_file) resolve against the GIT REPOSITORY ROOT, not this file's
# folder.
#
# Every key can be overridden by an environment variable named
# DBCTL_<SECTION>_<KEY> (uppercase), e.g. DBCTL_POSTGRES_PASSWORD.
# Precedence: env var > file > default.

[postgres]
container   = "my-postgres-container"   # required
user        = "my_db_user"              # required
# password  = "..."                     # optional if DBCTL_POSTGRES_PASSWORD is set
template_db = "my_template_db"          # required
db_prefix   = "dev_"                    # optional, default "dev_"

[odoo]
container       = "my-odoo-container"   # required
compose_service = "web"                 # required
compose_file    = "docker-compose.yml"  # optional, default "docker-compose.yml"
data_dir        = "/var/lib/odoo"       # optional, default "/var/lib/odoo"
default_modules = ["my_module"]         # optional; used by `upgrade` without -m

[seeds]
path  = "temp/seeds"                    # optional; if absent, `seed` is a no-op with a notice
mount = "/mnt/dbctl-seeds"              # optional, default "/mnt/dbctl-seeds"

[strategy]
kind          = "compose-override"      # "compose-override" | "custom"
override_file = "docker-compose.override.yaml"   # only for compose-override

[hooks]
enabled = true                          # optional, default true; false disables
                                        # the post-checkout hook without
                                        # uninstalling it (`dbctl hook`)

[modules]
detect = true                           # optional, default true; false returns
                                        # to the old -m/default_modules behavior
# base_ref    = "origin/main"           # optional; default = origin/HEAD, then
                                        # main/master/develop
# manifest    = "__manifest__.py"       # optional; file marking a module root
# install_new = true                    # optional; new module -> -i, not -u
# ignore      = ["**/static/**"]        # optional; globs that never trigger
                                        # an upgrade

# Escape hatch - only when kind = "custom".
# Placeholders available: {db}, {modules}, {install}, {project_root}
# [strategy.commands]
# start   = "..."
# stop    = "..."
# upgrade = "..."
# shell   = "..."
